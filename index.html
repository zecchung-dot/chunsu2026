<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>春淑秋冬賞楓跨年85日郊遊行・逐日行程</title>
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --paper:#e2946b;
    --paper-raised:#fffdf8;
    --ink:#242220;
    --ink-soft:#6b665e;
    --line:#ddd6c6;
    --stage-0:#f2c9a1;   /* 淺赤陶・初段 */
    --stage-1:#e8a877;   /* 赤陶橘（跟底色錯開） */
    --stage-2:#d4854f;   /* 中段過渡 */
    --stage-3:#bb5c37;   /* 深赤陶（跟按鈕色錯開） */
    --stage-4:#8a3c26;   /* 焦赤陶・最深段 */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{overflow-x:hidden;max-width:100%;-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px);background:#e2946b;}
  body{
    overflow-x:hidden;max-width:100%;touch-action:pan-y pinch-zoom;
    margin:0;background:var(--paper);color:var(--ink);
    font-family:"Noto Sans TC","Microsoft JhengHei UI","PingFang TC",sans-serif;
    line-height:1.55;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px;margin:0 auto;padding:0 0 60px;}

  /* ---- sticky masthead ---- */
  .masthead{
    position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
    background:var(--paper);color:var(--ink);
    padding:16px 20px 12px;
    border-bottom:1px solid var(--line);
  }
  .masthead::before, .masthead::after{
    content:'';position:absolute;top:9px;width:13px;height:13px;
    border-top:1px solid var(--stage-4);opacity:.55;
  }
  .masthead::before{left:9px;border-left:1px solid var(--stage-4);}
  .masthead::after{right:9px;border-right:1px solid var(--stage-4);}
  .masthead__leaf{
    display:none;position:absolute;top:14px;right:22px;width:34px;height:34px;
    color:var(--stage-4);opacity:.16;transform:rotate(12deg);pointer-events:none;
  }

  .masthead__toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .masthead__grid{
    display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;row-gap:4px;align-items:start;
  }
  .masthead__eyebrow{
    grid-column:1;grid-row:1;
    font-family:"Noto Serif TC",serif;font-style:italic;font-weight:500;
    font-size:11px;color:var(--paper-raised);letter-spacing:.04em;
    margin-top:4px;
  }
  .ticketinfo{
    display:flex;gap:10px;flex:none;
    padding-left:10px;border-left:1px dashed var(--ink-soft);
  }
  .ticketinfo__item{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;}
  .ti-lbl{font-size:8px;letter-spacing:.09em;color:var(--ink-soft);text-transform:uppercase;}
  .ti-val{font-family:"Noto Serif TC",serif;font-weight:700;font-size:13.5px;color:var(--ink);white-space:nowrap;}
  .ti-val.accent{color:#cc6341;font-size:15px;}

  .masthead__ticketcol{
    grid-column:2;grid-row:1;
    display:flex;flex-direction:column;align-items:flex-end;gap:5px;
  }

  .masthead__titlewrap{
    grid-column:1 / -1;grid-row:2;
    display:flex;flex-direction:column;align-items:flex-start;margin-top:2px;min-width:0;
  }
  .masthead__title{
    font-family:"Noto Serif TC",serif;font-weight:700;font-size:min(22px,6.1vw);
    margin:0;color:var(--ink);text-align:left;white-space:nowrap;max-width:100%;
  }

  .masthead__range{
    grid-column:1 / -1;grid-row:3;font-size:11px;color:var(--paper-raised);white-space:nowrap;
  }

  .masthead__seam{
    display:flex;align-items:center;margin:12px -20px 0;padding:0 20px;
  }
  .masthead__seam::before{
    content:'';flex:1;height:0;border-top:1px dashed rgba(36,34,32,.3);
  }


  .badges-cap{
    font-size:8px;letter-spacing:.06em;color:var(--ink-soft);
    padding:10px 0 0;
  }
  .badges{display:flex;flex-wrap:wrap;gap:6px 14px;padding:5px 0 0;}
  .badge{
    font-size:12px;padding:0 0 4px;border-radius:0;
    border:none;border-bottom:1.5px solid transparent;background:none;
    color:var(--ink-soft);text-decoration:none;font-weight:500;
  }
  .badge:active{color:var(--ink);border-bottom-color:var(--ink-soft);}

  .summary{
    margin:10px 18px 0;padding:9px 12px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;gap:8px;
  }
  .summary div{text-align:center;flex:1;}
  .summary .num{display:block;font-family:"Noto Serif TC",serif;font-weight:700;font-size:14px;}
  .summary .lbl{display:block;font-size:10px;color:var(--ink-soft);margin-top:1px;}
  .summary .sep{width:1px;background:var(--line);}

  .month-head{
    margin:22px 18px 8px;font-family:"Noto Serif TC",serif;font-weight:700;
    font-size:15px;color:var(--ink-soft);
    scroll-margin-top:400px;
  }

  /* ---- day row ---- */
  .day{
    margin:0 12px 8px;border:1px solid var(--line);border-left-width:5px;
    border-radius:8px;background:var(--paper-raised);overflow:hidden;
    scroll-margin-top:400px;
  }
  .day.is-today{box-shadow:0 0 0 2px var(--ink) inset;}
  .day.is-past{opacity:.5;background:var(--paper);}
  .day--special{
    background:#f3ede0;border-left-width:6px !important;
    border-left-color:#cc6341 !important;border-color:#e3d3b0;
  }
  .day--special .day__loc{color:#cc6341;}
  .day.is-past .day__loc, .day.is-past .day__date .d{color:var(--ink-soft);}
  .day__row{
    display:flex;align-items:center;gap:10px;padding:0 12px;height:68px;cursor:pointer;
    user-select:none;
  }
  .day__date{flex:none;width:auto;text-align:left;}
  .day__date .d{font-family:"Noto Serif TC",serif;font-weight:700;font-size:18px;display:block;line-height:1.1;white-space:nowrap;}
  .day__date .wd{font-size:14px;font-weight:600;margin-left:1px;}
  .day__date--range{width:auto !important;}
  .day__date--range .d{font-size:18px;white-space:nowrap;}
  .day__date .w{font-size:13px;color:var(--ink-soft);}
  .day__mid{flex:1;min-width:0;overflow:hidden;}
  .day__loc{font-size:21px;font-weight:700;line-height:1.25;}
  .day__preview{
    font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;margin-top:1px;
  }
  .day__star{flex:none;font-size:11px;color:var(--stage-3);}
  .day__flight{flex:none;font-size:14px;}
  .day__chev{flex:none;font-size:14px;color:var(--ink-soft);transition:transform .25s;}
  .day.open .day__chev{transform:rotate(180deg);}
  .day__panel{max-height:0;overflow:hidden;transition:max-height .3s ease;border-top:1px dashed var(--line);}
  .day.open .day__panel{max-height:980px;}
  .day__panel-inner{padding:14px;}
  .flightbox{
    margin-bottom:14px;padding:12px;border-radius:8px;
    background:var(--ink);color:var(--paper-raised);
  }
  .flightbox .flabel{
    font-size:12px;font-weight:700;margin-bottom:8px;
    display:flex;align-items:center;gap:6px;
  }
  .flightbox textarea{
    width:100%;min-height:52px;resize:vertical;font-family:inherit;font-size:13px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);border-radius:6px;
    padding:8px 9px;color:var(--paper-raised);
  }
  .flightbox textarea::placeholder{color:rgba(255,253,248,.5);}
  .flightbox textarea:focus{outline:2px solid var(--stage-1);outline-offset:1px;}
  .flightfixed{font-size:12.5px;line-height:1.6;}
  .flightfixed .ff-route{font-weight:700;font-size:13px;margin-bottom:3px;opacity:.9;}
  .flightfixed .ff-time{font-family:"Noto Serif TC",serif;font-weight:700;font-size:19px;margin-bottom:3px;}
  .flightfixed .ff-row{display:flex;justify-content:space-between;font-size:11.5px;opacity:.85;}

  .hotelbox{
    margin-bottom:14px;padding:14px;border-radius:10px;
    background:#f3ede0;border:1px solid var(--line);
  }
  .hotelbox .flabel{font-size:12.5px;font-weight:700;margin-bottom:8px;color:var(--ink-soft);}
  .hb-name{font-family:"Noto Serif TC",serif;font-weight:700;font-size:16px;margin-bottom:6px;}
  .hb-row{font-size:14px;line-height:1.7;}
  .hb-row a{color:#cc6341;font-weight:700;text-decoration:underline;}
  .hb-sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 4px 20px;}
  .hb-amenities{display:flex;gap:8px;margin:6px 0;flex-wrap:wrap;}
  .hb-chip{font-size:12.5px;background:var(--paper-raised);border:1px solid var(--line);border-radius:99px;padding:4px 10px;}

  .tr-step{
    font-size:14px;line-height:1.6;padding:7px 0;
    border-bottom:1px dashed var(--line);
  }
  .tr-head{font-size:15px;line-height:1.45;white-space:nowrap;}
  .tr-sub{font-size:14px;line-height:1.5;color:var(--ink-soft);margin-top:2px;white-space:nowrap;}
  .tr-head.wrap, .tr-sub.wrap{white-space:normal;}
  .tr-step:last-child{border-bottom:none;padding-bottom:0;}
  .tr-step:first-child{padding-top:0;}

  .section-h{
    font-size:11.5px;font-weight:700;letter-spacing:.1em;color:#cc6341;
    margin:16px 0 8px;padding-top:14px;border-top:1px dashed var(--line);
  }
  .section-h--first{margin-top:0;padding-top:0;border-top:none;}

  .weatherbox{
    display:flex;align-items:center;gap:10px;margin-bottom:14px;
    padding:5px 0 0;
  }
  .foliage-link, .weather-link{
    display:inline-flex;align-items:center;gap:4px;margin:0 14px 12px 0;
    font-size:12px;color:var(--ink-soft);text-decoration:none;
    padding:0 0 3px;border:none;border-bottom:1px solid var(--line);background:none;
  }
  .foliage-link:active, .weather-link:active{color:var(--ink);border-bottom-color:var(--ink-soft);}
  .day__suggest{white-space:pre-line;font-size:14.5px;line-height:1.7;color:#3c3a34;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:11px;color:var(--ink-soft);margin-bottom:4px;}
  .field textarea{
    width:100%;min-height:42px;resize:vertical;font-family:inherit;font-size:13px;
    background:var(--paper);border:1px solid var(--line);border-radius:6px;
    padding:7px 9px;color:var(--ink);
  }
  .field input[type=number]{
    width:100%;font-family:inherit;font-size:13px;
    background:var(--paper);border:1px solid var(--line);border-radius:6px;
    padding:7px 9px;color:var(--ink);
  }
  .field textarea:focus, .field input:focus{outline:2px solid var(--ink);outline-offset:1px;}
  .field textarea::placeholder, .field input::placeholder{color:#a8a296;}
  .navbtn{
    display:inline-flex;align-items:center;gap:4px;margin-top:5px;
    font-size:12px;color:var(--ink-soft);text-decoration:none;
    padding:0 0 3px;border:none;border-bottom:1px solid var(--line);background:none;
  }
  .navbtn:active{color:var(--ink);border-bottom-color:var(--ink-soft);}
  .cost-row{display:flex;gap:10px;}
  .cost-row .field{flex:1;}
  .save-hint{font-size:10.5px;color:var(--ink-soft);height:13px;opacity:0;transition:opacity .3s;}
  .save-hint.show{opacity:1;}

  .footer-note{margin:32px 18px 0;font-size:11.5px;color:var(--ink-soft);padding-top:16px;border-top:1px solid var(--line);}

  /* ---- sticky-extra blocks nested inside the masthead: strip the horizontal
         spacing that assumed top-level page padding, keep vertical rhythm ---- */
  .masthead .badges{padding:0;}
  .masthead .summary{margin:8px 0 0;}
  .masthead .ledger-dash{margin:8px 0 0;}
  .sticky-extra{margin-bottom:0;}

  /* ---- tabs: filled pill, sitting comfortably inside the masthead ---- */
  .tabnav{
    display:flex;justify-content:center;
    margin:14px 0 2px;
  }
  .tabnav-pill{
    display:flex;gap:2px;background:rgba(36,34,32,.06);border-radius:99px;
    padding:3px;
  }
  .tab-btn{
    padding:7px 20px;border-radius:99px;border:none;
    background:none;color:var(--ink-soft);font-size:12.5px;font-weight:600;
    font-family:inherit;cursor:pointer;
  }
  .tab-btn.active{background:#cc6341;color:var(--paper-raised);}
  .tabview{display:none;}
  .tabview.active{display:block;}

  /* ---- ledger ---- */
  .ledger-dash{
    display:flex;gap:10px;margin:16px 18px 0;
  }
  .ledger-dash .card{
    flex:1;padding:14px;border-radius:10px;background:var(--paper-raised);
    border:1px solid var(--line);text-align:center;
  }
  .ledger-dash .card .num{font-family:"Noto Serif TC",serif;font-weight:700;font-size:19px;}
  .ledger-dash .card .lbl{font-size:11px;color:var(--ink-soft);margin-top:3px;}

  .scan-area{margin:14px 18px 0;}
  .scan-btn{
    display:flex;align-items:center;justify-content:center;gap:7px;width:100%;
    padding:10px;border-radius:8px;border:1.5px solid #cc6341;
    background:none;color:#cc6341;
    font-size:13.5px;font-weight:700;font-family:inherit;cursor:pointer;
  }
  .scan-btn:active{background:rgba(204,99,65,.08);}
  .scan-manual{
    display:block;text-align:center;margin-top:6px;font-size:12px;
    color:var(--ink-soft);text-decoration:underline;background:none;border:none;
    font-family:inherit;cursor:pointer;width:100%;padding:5px;
  }

  .ledger-status{margin:12px 18px 0;font-size:13px;color:var(--ink-soft);text-align:center;}

  .confirm-card{
    margin:14px 18px 0;padding:14px;border-radius:10px;
    background:var(--paper-raised);border:1px solid var(--line);
  }
  .confirm-card h3{font-family:"Noto Serif TC",serif;font-size:14px;margin:0 0 10px;}
  .cfield{margin-bottom:9px;}
  .cfield label{display:block;font-size:11px;color:var(--ink-soft);margin-bottom:3px;}
  .cfield input, .cfield textarea, .cfield select{
    width:100%;font-family:inherit;font-size:13px;color:var(--ink);
    background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px 8px;
  }
  .cfield textarea{min-height:56px;resize:vertical;}
  .confirm-actions{display:flex;gap:8px;margin-top:12px;}
  .confirm-actions button{
    flex:1;padding:8px;border-radius:7px;font-size:13px;font-weight:600;
    font-family:inherit;cursor:pointer;border:none;
  }
  .btn-save{background:#cc6341;color:var(--paper-raised);}
  .btn-cancel{background:var(--paper);border:1px solid var(--line) !important;color:var(--ink-soft);}

  .receipt-list{margin:20px 18px 0;}
  .lday{margin-bottom:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--paper-raised);}
  .lday__head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .lday__date{font-size:11.5px;color:var(--ink-soft);}
  .lday__loc{font-size:12.5px;font-weight:600;margin-left:6px;}
  .lday__sub{font-family:"Noto Serif TC",serif;font-weight:700;font-size:13px;color:#cc6341;}
  .lday__grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .lday__grid div{display:flex;flex-direction:column;gap:2px;}
  .lday__grid label{font-size:9.5px;color:var(--ink-soft);}
  .lday__grid input{
    width:100%;font-family:inherit;font-size:12px;color:var(--ink);
    background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:5px 4px;
  }
  .receipt-list h3{font-family:"Noto Serif TC",serif;font-size:14px;color:var(--ink-soft);margin:0 0 10px;}
  .receipt-item{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:11px 13px;border:1px solid var(--line);border-radius:8px;
    background:var(--paper-raised);margin-bottom:8px;
  }
  .receipt-item .ri-main{min-width:0;}
  .receipt-item .ri-store{font-size:13.5px;font-weight:500;}
  .receipt-item .ri-meta{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .receipt-item .ri-amount{font-family:"Noto Serif TC",serif;font-weight:700;font-size:14px;flex:none;}
  .receipt-item .ri-del{
    flex:none;background:none;border:none;color:var(--ink-soft);font-size:16px;
    cursor:pointer;padding:4px;
  }
  .empty-hint{margin:20px 18px 0;font-size:12.5px;color:var(--ink-soft);text-align:center;padding:20px;}
</style>
<!-- 2026-10-14 v7 -->
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <svg class="masthead__leaf" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3">
      <path d="M50 8 L58 33 L82 24 L64 46 L90 56 L63 58 L70 84 L50 63 L30 84 L37 58 L10 56 L36 46 L18 24 L42 33 Z"/>
    </svg>
    <div class="masthead__grid">
      <div class="masthead__eyebrow">春淑、秋冬を巡るひとり旅</div>
      <div class="masthead__ticketcol">
        <div class="ticketinfo" id="dayCounter">
          <div class="ticketinfo__item">
            <span class="ti-lbl">本日</span>
            <span class="ti-val" id="tiToday">–</span>
          </div>
          <div class="ticketinfo__item">
            <span class="ti-lbl" id="tiLabel2">出発まで</span>
            <span class="ti-val accent" id="tiValue2">–</span>
          </div>
        </div>
      </div>
      <div class="masthead__titlewrap">
        <h1 class="masthead__title">春淑秋冬賞楓跨年85日郊遊行</h1>
      </div>
      <div class="masthead__range">旅行期間：10/15 – 1/7</div>
    </div>

    <div class="masthead__seam"></div>

    <div class="tabnav">
      <div class="tabnav-pill">
        <button class="tab-btn active" data-tab="itinerary">行程</button>
        <button class="tab-btn" data-tab="ledger">記帳</button>
        <button class="tab-btn" data-tab="tickets">新幹線取票</button>
      </div>
    </div>

    <div class="masthead__seam"></div>

    <div id="sticky-itinerary-extra" class="sticky-extra">
      <div class="badges-cap">旅行路線・旅のルート</div>
      <div class="badges" id="badges">
        <a class="badge" data-target="2026-10-15">青森</a>
        <a class="badge" data-target="2026-10-17">奧入瀨</a>
        <a class="badge" data-target="2026-10-18">十和田</a>
        <a class="badge" data-target="2026-10-20">秋田</a>
        <a class="badge" data-target="2026-10-22">田澤湖</a>
        <a class="badge" data-target="2026-10-24">角館</a>
        <a class="badge" data-target="2026-10-26">大宮</a>
        <a class="badge" data-target="2026-10-29">松本</a>
        <a class="badge" data-target="2026-11-02">長野</a>
        <a class="badge" data-target="2026-11-08">伊那</a>
        <a class="badge" data-target="2026-11-10">馬籠</a>
        <a class="badge" data-target="2026-11-14">滋賀・京都</a>
      </div>
    </div>

    <div id="sticky-ledger-extra" class="sticky-extra" style="display:none">
      <div class="ledger-dash">
        <div class="card"><span class="num" id="ledgerToday">¥0</span><span class="lbl">今日花費</span></div>
        <div class="card"><span class="num" id="ledgerTotal">¥0</span><span class="lbl">旅程累計</span></div>
      </div>
    </div>
  </div>

  <div id="view-itinerary" class="tabview active">

  <div id="list"></div>

  <div class="footer-note">
    點每一天可以展開看當天建議行程，填住宿／交通／備註跟花費，內容會自動存檔。上面的地名標籤可以直接點過去、快速跳到那一段。金額預設是新台幣，也可以直接當日幣記，自己知道單位就好。京都長住期間的行程是空白的，可以自己排。
  </div>

  </div>

  <div id="view-ledger" class="tabview">

    <div class="scan-area">
      <button class="scan-btn" id="scanBtn">📷　掃描收據</button>
      <input type="file" id="receiptInput" accept="image/*" capture="environment" style="display:none">
      <button class="scan-manual" id="manualBtn">或手動輸入一筆</button>
    </div>

    <div class="ledger-status" id="ledgerStatus"></div>

    <div id="confirmArea"></div>

    <div class="receipt-list">
      <h3>消費紀錄</h3>
      <div id="receiptListInner"></div>
    </div>

    <div class="receipt-list">
      <h3>逐日花費</h3>
      <div id="ledgerDays"></div>
    </div>

  </div>

// 把Excel裡分行的交通步驟，轉成一條一條清楚的卡片列；只有「時間 站名 → 時間 站名」這段加粗，｜後面的班次備註維持正常字重
function renderSteps(text){
  const lines = text.split('\n').map(s => s.trim()).filter(Boolean);
  const moveRe = /\d{1,2}:\d{2}.*→.*\d{1,2}:\d{2}/;
  return lines.map(line => {
    const bar = line.indexOf('｜');
    if(bar === -1){
      return `<div class="tr-step"><div class="tr-head">${moveRe.test(line) ? `<strong>${line}</strong>` : line}</div></div>`;
    }
    const head = line.slice(0, bar).trim();
    const rest = line.slice(bar+1).trim();
    return `<div class="tr-step"><div class="tr-head">${moveRe.test(head) ? `<strong>${head}</strong>` : head}</div><div class="tr-sub">${rest}</div></div>`;
  }).join('');
}

function stageColor(i, n){
  const stops = ['--stage-0','--stage-1','--stage-2','--stage-3','--stage-4'];
  const t = n<=1?0:i/(n-1);
  const idx = Math.min(stops.length-1, Math.round(t*(stops.length-1)));
  return `var(${stops[idx]})`;
}

function updateDayCounter(){
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const tripStart = new Date('2026-10-15T00:00:00');
  const tripEnd = new Date('2027-01-07T00:00:00');
  const totalDays = Math.round((tripEnd - tripStart)/86400000) + 1;

  const WDfull = ['日','一','二','三','四','五','六'];
  const dateStr = `${now.getMonth()+1}/${now.getDate()}（${WDfull[now.getDay()]}）`;
  document.getElementById('tiToday').textContent = dateStr;

  const lbl2 = document.getElementById('tiLabel2');
  const val2 = document.getElementById('tiValue2');
  if(today < tripStart){
    const diff = Math.round((tripStart - today)/86400000);
    lbl2.textContent = '出発まで';
    val2.textContent = diff + '天後';
  }else if(today <= tripEnd){
    const dayNum = Math.round((today - tripStart)/86400000) + 1;
    lbl2.textContent = '旅程';
    val2.textContent = dayNum + '／' + totalDays;
  }else{
    lbl2.textContent = '旅程';
    val2.textContent = '終了 🍁';
  }
}

// ============ 記帳：收據辨識與記錄 ============
function getRegionForDate(dateStr){
  const match = DAYS.find(d => d.d === dateStr);
  return match ? match.loc : '';
}

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function extractReceipt(file){
  const sample = window.claude ? await claude.use('sample') : null;
  if(!sample) throw new Error('unavailable');
  const prompt = `這是一張日本收據的照片。請仔細判讀後，只回傳一個JSON物件。欄位辨識不到時請填空字串或0，不要省略任何欄位：
{"store_zh":"店名，翻譯成繁體中文","store_ja":"店名原文（日文）","date":"收據上的日期，格式YYYY-MM-DD，辨識不到留空字串","total":總金額數字（不含符號，日圓）,"tax_type":"稅別，例如：內稅／外稅／免稅，辨識不到留空字串","payment_method":"付款方式，例如：現金／信用卡，辨識不到留空字串","items":[{"name_zh":"品項名稱，翻譯成繁體中文","price":價格數字}]}`;
  return await sample.json(prompt, { images: file, cache: false });
}

// 沒有 Claude 功能的環境就把掃描按鈕藏起來，保留手動輸入
(async () => {
  try{
    const s = window.claude ? await claude.use('sample') : null;

})();

function itemsToText(items){
  if(!items || !items.length) return '';
  return items.map(it => `${it.name_zh || it.name || ''}　¥${it.price || 0}`).join('\n');
}

function showConfirmForm(extracted){
  const _n2 = new Date(); const todayISO2 = _n2.getFullYear()+'-'+String(_n2.getMonth()+1).padStart(2,'0')+'-'+String(_n2.getDate()).padStart(2,'0');
  const date = (extracted && extracted.date) || todayISO2;
  const region = getRegionForDate(date) || getRegionForDate(todayISO2) || '';
  const area = document.getElementById('confirmArea');
  area.innerHTML = `
    <div class="confirm-card">
      <h3>確認收據內容</h3>
      <div class="cfield"><label>店名</label><input id="cf-store" value="${(extracted && extracted.store_zh) || ''}"></div>
      <div class="cfield"><label>日期</label><input id="cf-date" type="date" value="${date}"></div>
      <div class="cfield"><label>地區</label><input id="cf-region" value="${region}" placeholder="例如：京都"></div>
      <div class="cfield"><label>金額 (¥)</label><input id="cf-total" type="number" value="${(extracted && extracted.total) || ''}"></div>
      <div class="cfield"><label>稅別</label><input id="cf-tax" value="${(extracted && extracted.tax_type) || ''}"></div>
      <div class="cfield"><label>付款方式</label><input id="cf-payment" value="${(extracted && extracted.payment_method) || ''}"></div>
      <div class="cfield"><label>品項</label><textarea id="cf-items" placeholder="品名　金額（一行一項）">${itemsToText(extracted && extracted.items)}</textarea></div>
      <div class="confirm-actions">
        <button class="btn-cancel" id="cf-cancel">取消</button>
        <button class="btn-save" id="cf-save">儲存這筆</button>
      </div>
    </div>
  `;
  document.getElementById('cf-cancel').addEventListener('click', () => { area.innerHTML = ''; });
  document.getElementById('cf-save').addEventListener('click', saveReceiptFromForm);
}

async function saveReceiptFromForm(){
  const record = {
    storeZh: document.getElementById('cf-store').value,
    date: document.getElementById('cf-date').value,
    region: document.getElementById('cf-region').value,
    total: Number(document.getElementById('cf-total').value) || 0,
    taxType: document.getElementById('cf-tax').value,
    paymentMethod: document.getElementById('cf-payment').value,
    itemsText: document.getElementById('cf-items').value,
    savedAt: new Date().toISOString()
  };
  const id = Date.now() + '-' + Math.random().toString(36).slice(2,7);
  try{
    await store.set('receipt:'+id, JSON.stringify(record), false);
    document.getElementById('confirmArea').innerHTML = '';
    refreshLedger();
  }catch(e){
    document.getElementById('ledgerStatus').textContent = '儲存失敗，請再試一次。';
  }
}

async function loadAllReceipts(){
  try{
    const listRes = await store.list('receipt:', false);
    if(!listRes || !listRes.keys) return [];
    const items = await Promise.all(listRes.keys.map(async k => {
      try{
        const r = await store.get(k, false);
        return r ? { id: k, ...JSON.parse(r.value) } : null;
      }catch(e){ return null; }
    }));
    return items.filter(Boolean).sort((a,b) => (b.savedAt||'').localeCompare(a.savedAt||''));
  }catch(e){
    return [];
  }
}

async function deleteReceipt(id){
  try{
    await store.delete(id, false);
    refreshLedger();
  }catch(e){ /* ignore */ }
}

function renderReceiptList(receipts){
  const el = document.getElementById('receiptListInner');
  if(!receipts.length){
    el.innerHTML = '<div class="empty-hint">還沒有記錄，掃第一張收據看看吧</div>';
    return;
  }
  el.innerHTML = receipts.map(r => `
    <div class="receipt-item">
      <div class="ri-main">
        <div class="ri-store">${r.storeZh || '（未命名）'}</div>
        <div class="ri-meta">${r.date || ''}　${r.region || ''}</div>
      </div>
      <div class="ri-amount">¥${(r.total||0).toLocaleString('zh-Hant')}</div>
      <button class="ri-del" data-del="${r.id}">✕</button>
    </div>
  `).join('');
  el.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', () => deleteReceipt(btn.dataset.del));
  });
}

async function refreshLedger(){
  const receipts = await loadAllReceipts();
  const _n2 = new Date(); const todayISO2 = _n2.getFullYear()+'-'+String(_n2.getMonth()+1).padStart(2,'0')+'-'+String(_n2.getDate()).padStart(2,'0');
  const todayTotal = receipts.filter(r => r.date === todayISO2).reduce((s,r) => s + (r.total||0), 0);
  const grandTotal = receipts.reduce((s,r) => s + (r.total||0), 0);
  document.getElementById('ledgerToday').textContent = '¥' + todayTotal.toLocaleString('zh-Hant');
  document.getElementById('ledgerTotal').textContent = '¥' + grandTotal.toLocaleString('zh-Hant');
  renderReceiptList(receipts);
}

document.getElementById('scanBtn').addEventListener('click', () => {
  document.getElementById('receiptInput').click();
});
document.getElementById('receiptInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const status = document.getElementById('ledgerStatus');
  status.textContent = '辨識中…（日文收據可能要幾秒鐘）';
  document.getElementById('confirmArea').innerHTML = '';
  try{
    const extracted = await extractReceipt(file);
    status.textContent = '';
    showConfirmForm(extracted);
  }catch(err){
    console.error(err);
    status.textContent = '辨識失敗了，可以改用「手動輸入一筆」。';
  }
  e.target.value = '';
});
document.getElementById('manualBtn').addEventListener('click', () => {
  document.getElementById('ledgerStatus').textContent = '';
  showConfirmForm(null);
});

// ============ 車票 QR code ============
async function loadAllTickets(){
  try{
    const listRes = await store.list('ticket:');
    if(!listRes || !listRes.keys) return [];
    const items = await Promise.all(listRes.keys.map(async k => {
      try{ const r = await store.get(k); return r ? { id:k, ...JSON.parse(r.value) } : null; }
      catch(e){ return null; }
    }));
    return items.filter(Boolean).sort((a,b) => (a.date||a.savedAt||'').localeCompare(b.date||b.savedAt||''));
  }catch(e){ return []; }
}
async function renderTicketList(){
  const tickets = await loadAllTickets();
  const el = document.getElementById('ticketListInner');
  if(!tickets.length){
    el.innerHTML = '<div class="empty-hint">還沒有加入車票，點上面「加入車票 QR code」拍照或選圖片</div>';
    return;
  }
  el.innerHTML = tickets.map(t => `
    <div class="confirm-card" style="margin:0 0 10px;padding:12px;">
      <div style="display:flex;gap:10px;">
        <img class="ticket-thumb" data-img="${t.id}" src="${t.img}" style="width:84px;height:84px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px;flex:none;cursor:pointer;">
        <div style="flex:1;min-width:0;">
          <div class="cfield" style="margin-bottom:6px;">
            <label>乘車日</label>
            <input type="date" class="ticket-date" data-id="${t.id}" value="${t.date||''}">
          </div>
          <div class="cfield" style="margin-bottom:0;">
            <label>路線</label>
            <input type="text" class="ticket-route" data-id="${t.id}" value="${(t.route||'').replace(/"/g,'&quot;')}" placeholder="例如：松本→長野 新幹線">
          </div>
          <div class="cfield" style="margin-bottom:0;margin-top:6px;">
            <label>取票號碼</label>
            <input type="text" class="ticket-code" data-id="${t.id}" value="${(t.code||'').replace(/"/g,'&quot;')}" placeholder="例如：予約番号10022065431">
          </div>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
        <span class="save-hint-mini" data-hintid="${t.id}" style="font-size:10.5px;color:var(--ink-soft);opacity:0;transition:opacity .3s;">已儲存 ✓</span>
        <button class="ri-del" data-delticket="${t.id}">刪除車票 ✕</button>
      </div>
    </div>
  `).join('');

  el.querySelectorAll('.ticket-thumb').forEach(img => img.addEventListener('click', () => {
    document.getElementById('ticketLightboxImg').src = img.src;
    document.getElementById('ticketLightbox').style.display = 'flex';
  }));

  el.querySelectorAll('[data-delticket]').forEach(b => b.addEventListener('click', async () => {
    await store.delete(b.dataset.delticket);
    renderTicketList();
  }));

  async function saveTicketField(id, field, value){
    const hint = el.querySelector(`.save-hint-mini[data-hintid="${id}"]`);
    try{
      const r = await store.get(id);
      const data = JSON.parse(r.value);
      data[field] = value;
      await store.set(id, JSON.stringify(data));
      if(hint){ hint.textContent = '已儲存 ✓'; hint.style.opacity = 1; setTimeout(()=>hint.style.opacity=0, 1200); }
    }catch(e){
      if(hint){ hint.textContent = '儲存失敗，請再試一次'; hint.style.opacity = 1; }
      console.error('ticket field save failed', e);
    }
  }
  el.querySelectorAll('.ticket-date').forEach(inp => {
    inp.addEventListener('change', () => saveTicketField(inp.dataset.id, 'date', inp.value));
  });
  el.querySelectorAll('.ticket-route').forEach(inp => {
    let t;
    inp.addEventListener('click', e => e.stopPropagation());
    inp.addEventListener('input', () => {
      clearTimeout(t);
      t = setTimeout(() => saveTicketField(inp.dataset.id, 'route', inp.value), 500);
    });
  });
  el.querySelectorAll('.ticket-code').forEach(inp => {
    let t;
    inp.addEventListener('click', e => e.stopPropagation());
    inp.addEventListener('input', () => {
      clearTimeout(t);
      t = setTimeout(() => saveTicketField(inp.dataset.id, 'code', inp.value), 500);
    });
  });
}
function refreshTickets(){ renderTicketList(); }

// 把照片縮小壓縮後再存，避免原始相機照片太大塞爆手機儲存空間、拖慢網頁
function resizeImage(file, maxSize){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => { img.onload = () => {
      let { width, height } = img;
      if(width > height && width > maxSize){ height = Math.round(height * maxSize/width); width = maxSize; }
      else if(height > maxSize){ width = Math.round(width * maxSize/height); height = maxSize; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = reject;
    img.src = reader.result; };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.getElementById('ticketAddBtn').addEventListener('click', () => {
  document.getElementById('ticketInput').click();
});
document.getElementById('ticketInput').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  if(!files.length) return;
  const status = document.getElementById('ticketStatus');
  status.textContent = '加入中…';
  let failCount = 0;
  for(const file of files){
    try{
      const resized = await resizeImage(file, 1100);
      const id = 'ticket:' + Date.now() + '-' + Math.random().toString(36).slice(2,7);
      await store.set(id, JSON.stringify({ img: resized, date: '', route: '', code: '', savedAt: new Date().toISOString() }));
    }catch(err){ console.error(err); failCount++; }
  }
  status.textContent = failCount ? `有 ${failCount} 張存失敗，可能是手機空間不足，可以先刪掉舊的車票再試一次` : '';
  e.target.value = '';
  renderTicketList();
});
